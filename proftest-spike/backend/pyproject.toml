[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-proftest-spike"
version = "0.1.0"
description = "Изолированный Spike профориентации по содержанию учебных планов Andromeda"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["src/proftest_spike"]
