services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ANDROMEDA_STAGING_DB}
      POSTGRES_USER: ${ANDROMEDA_STAGING_DB_USER}
      POSTGRES_PASSWORD: ${ANDROMEDA_STAGING_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ANDROMEDA_ENV: staging
      ANDROMEDA_DATABASE_URL: postgresql+psycopg://${ANDROMEDA_STAGING_DB_USER}:${ANDROMEDA_STAGING_DB_PASSWORD}@postgres:5432/${ANDROMEDA_STAGING_DB}
      FRONTEND_ORIGIN: ${ANDROMEDA_FRONTEND_ORIGIN:-https://${ANDROMEDA_DOMAIN}}
      ANDROMEDA_OPS_API_KEY: ${ANDROMEDA_OPS_API_KEY}
      LOG_LEVEL: INFO
      ANDROMEDA_DB_POOL_SIZE: 5
      ANDROMEDA_DB_MAX_OVERFLOW: 10
    volumes:
      - andromeda_data:/app/data

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      ANDROMEDA_INTERNAL_API_URL: http://backend:8020

  telegram-bot:
    image: ${TELEGRAM_BOT_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ANDROMEDA_BACKEND_URL: http://backend:8020
      ANDROMEDA_RENDERER_URL: http://frontend:3000
      ANDROMEDA_RENDER_HMAC_SECRET: ${ANDROMEDA_RENDER_HMAC_SECRET}
      ANDROMEDA_SESSION_ENCRYPTION_KEY: ${ANDROMEDA_SESSION_ENCRYPTION_KEY}
      ANDROMEDA_WEB_APP_URL: ${ANDROMEDA_WEB_APP_URL}
      ANDROMEDA_SESSION_DB: /var/lib/andromeda-telegram/state.sqlite3
      LOG_LEVEL: INFO
    volumes:
      - telegram_bot_data:/var/lib/andromeda-telegram

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      ANDROMEDA_DOMAIN: ${ANDROMEDA_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  andromeda_data:
  caddy_data:
  caddy_config:
  telegram_bot_data:
