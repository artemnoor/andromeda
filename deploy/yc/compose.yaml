services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      ANDROMEDA_ENV: test
      BMSTU_DATABASE_URL: sqlite:////app/data/tracer.db
      FRONTEND_ORIGIN: http://localhost
      LOG_LEVEL: INFO
      BMSTU_DB_POOL_SIZE: 1
      BMSTU_DB_MAX_OVERFLOW: 0
    volumes:
      - andromeda_data:/app/data

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend

  telegram-bot:
    image: ${TELEGRAM_BOT_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ANDROMEDA_BACKEND_URL: http://backend:8020
      ANDROMEDA_RENDERER_URL: http://frontend:3000
      ANDROMEDA_RENDER_HMAC_SECRET: ${ANDROMEDA_RENDER_HMAC_SECRET}
      ANDROMEDA_SESSION_ENCRYPTION_KEY: ${ANDROMEDA_SESSION_ENCRYPTION_KEY}
      ANDROMEDA_WEB_APP_URL: ${ANDROMEDA_WEB_APP_URL}
      ANDROMEDA_SESSION_DB: /var/lib/andromeda-telegram/state.sqlite3
      LOG_LEVEL: INFO
    volumes:
      - telegram_bot_data:/var/lib/andromeda-telegram

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  andromeda_data:
  caddy_data:
  caddy_config:
  telegram_bot_data:
