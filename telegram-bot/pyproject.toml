[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-telegram-client"
version = "0.1.0"
description = "Aiogram client for the Andromeda decision API"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "cryptography>=43",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
andromeda-telegram = "andromeda_telegram.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["src/andromeda_telegram"]
