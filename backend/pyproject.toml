[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmstu-andromeda-parser"
version = "0.1.0"
description = "Конфигурационно управляемый парсер источников МГТУ им. Н.Э. Баумана для Andromeda"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "PyMuPDF>=1.24",
  "pdfplumber>=0.11",
  "pypdf>=3.17",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = [
  "jsonschema>=4.22",
  "mypy>=1.11",
  "pytest>=8.0",
]

[project.scripts]
bmstu-parser = "bmstu_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/bmstu_parser/contracts", "src/bmstu_parser/tracer", "src/bmstu_parser/db", "src/bmstu_parser/api"]
