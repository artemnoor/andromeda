name: contract-first-tracer

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler for study-plan parsing
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
          pdftotext -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify BMSTU study-plan text layer
        run: |
          pdftotext -layout backend/tests/fixtures/tracer/raw/curriculum.pdf "$RUNNER_TEMP/bmstu-curriculum.txt"
          grep -q "ПЛАН УЧЕБНОГО ПРОЦЕССА" "$RUNNER_TEMP/bmstu-curriculum.txt"
      - run: python -m pip install -e "backend[dev]"
      - run: python -m pytest -q
        working-directory: backend
      - run: python backend/scripts/run_tracer_bullet.py --mode fixture --database-url sqlite:///backend/data/ci.db --log-level ERROR
      - run: python -m mypy
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev]"
      - run: python backend/scripts/export_openapi.py --out frontend/openapi.ci.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check-api-drift
        working-directory: frontend
        env:
          OPENAPI_FILE: openapi.ci.json
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  fullstack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler for study-plan parsing
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run fixture through DB, API, and frontend
        run: python backend/scripts/run_tracer_demo.py --mode fixture --check --log-level INFO
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start fixture demo for browser tests
        shell: bash
        run: |
          python backend/scripts/run_tracer_demo.py --mode fixture --log-level INFO > "$RUNNER_TEMP/andromeda-demo.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/andromeda-demo.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/andromeda-demo.log"
          exit 1
      - name: Run browser comparison and admissions scenarios
        run: npm run test:e2e
        working-directory: frontend
      - name: Stop fixture demo
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/andromeda-demo.pid" ]; then kill "$(cat "$RUNNER_TEMP/andromeda-demo.pid")" || true; fi

  postgresql-integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      ANDROMEDA_ENV: test
      ANDROMEDA_POSTGRES_TEST_URL: postgresql+psycopg://andromeda:andromeda-ci@127.0.0.1:5432/andromeda_ci
      BMSTU_DATABASE_URL: postgresql+psycopg://andromeda:andromeda-ci@127.0.0.1:5432/andromeda_ci
      LOG_LEVEL: INFO
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: andromeda_ci
          POSTGRES_USER: andromeda
          POSTGRES_PASSWORD: andromeda-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andromeda -d andromeda_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler for study-plan parsing
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev]"
      - name: Apply Alembic migrations to PostgreSQL
        run: python -m alembic upgrade head
        working-directory: backend
      - name: Run parser to PostgreSQL API smoke
        run: python -m pytest -q tests/integration/test_postgresql_ingestion.py tests/integration/test_postgresql_smoke.py tests/integration/test_postgresql_user_profile.py tests/integration/test_admission_fit_vertical_slice.py
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: python backend/scripts/export_openapi.py --out frontend/openapi.ci.json
      - run: npm run check-api-drift
        working-directory: frontend
        env:
          OPENAPI_FILE: openapi.ci.json
      - run: npm run build
        working-directory: frontend
      - name: Run PostgreSQL fixture fullstack check
        run: python backend/scripts/run_tracer_demo.py --mode fixture --database-url "$BMSTU_DATABASE_URL" --check --log-level INFO
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start PostgreSQL-backed demo for browser tests
        shell: bash
        run: |
          python backend/scripts/run_tracer_demo.py --mode fixture --database-url "$BMSTU_DATABASE_URL" --log-level INFO > "$RUNNER_TEMP/andromeda-postgres-demo.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/andromeda-postgres-demo.pid"
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/andromeda-postgres-demo.log"
          exit 1
      - name: Run PostgreSQL-backed browser scenarios
        run: npm run test:e2e
        working-directory: frontend
      - name: Stop PostgreSQL-backed demo
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/andromeda-postgres-demo.pid" ]; then kill "$(cat "$RUNNER_TEMP/andromeda-postgres-demo.pid")" || true; fi

  proftest-integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler for fixture contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev]"
      - name: Run production proftest contract and integration tests
        run: python -m pytest -q backend/tests/modules/proftest backend/tests/modules/admission_fit backend/tests/api/test_proftest_api.py backend/tests/api/test_proftest_contract.py backend/tests/api/test_proftest_profile_api.py backend/tests/api/test_proftest_profile_contract.py backend/tests/api/test_admission_fit_api.py backend/tests/api/test_admission_fit_contract.py backend/tests/integration/test_proftest_catalog.py backend/tests/integration/test_proftest_vertical_slice.py backend/tests/integration/test_user_profile_persistence.py backend/tests/integration/test_admission_fit_vertical_slice.py
      - name: Run recommendation module and API integration tests
        run: python -m pytest -q backend/tests/modules/recommendations backend/tests/api/test_recommendations_api.py backend/tests/api/test_recommendations_contract.py backend/tests/integration/test_recommendations_catalog.py
      - name: Run strict Andromeda typing gate
        run: python -m mypy backend/src/andromeda
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend

  proftest-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install study-plan and Spike dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e "backend[dev]" -e "proftest-spike/backend[dev]"
      - name: Run Spike backend tests
        run: python -m pytest -q
        working-directory: proftest-spike/backend
      - name: Run strict typing checks
        run: python -m mypy --strict --platform linux proftest-spike/backend/src/proftest_spike proftest-spike/scripts/run_spike_demo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: proftest-spike/frontend/package-lock.json
      - run: npm ci
        working-directory: proftest-spike/frontend
      - run: npm run test:unit
        working-directory: proftest-spike/frontend
      - run: npm run build
        working-directory: proftest-spike/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: proftest-spike/frontend
      - name: Prepare Andromeda fixture API
        run: python backend/scripts/run_tracer_bullet.py --mode fixture --database-url sqlite:///backend/data/proftest-spike-ci.db --log-level ERROR
      - name: Start Andromeda read API
        shell: bash
        run: |
          export BMSTU_DATABASE_URL="sqlite:///backend/data/proftest-spike-ci.db"
          export PYTHONPATH="$GITHUB_WORKSPACE/backend/src"
          python -m uvicorn andromeda.api.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/andromeda-proftest.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/andromeda-proftest.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/andromeda-proftest.log"
          exit 1
      - name: Start Spike services and run API personas
        shell: bash
        run: |
          python proftest-spike/scripts/run_spike_demo.py --andromeda-base-url http://127.0.0.1:8000 --spike-port 8110 --frontend-port 5175 --keep-alive > "$RUNNER_TEMP/proftest-spike.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/proftest-spike.pid"
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8110/api/health > /dev/null && curl --fail --silent http://127.0.0.1:5175/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/proftest-spike.log"
          exit 1
      - name: Check Spike OpenAPI drift
        run: npm run check-api-drift
        working-directory: proftest-spike/frontend
        env:
          OPENAPI_URL: http://127.0.0.1:8110/openapi.json
      - name: Run Spike browser scenarios
        run: npm run test:e2e
        working-directory: proftest-spike/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5175
      - name: Stop Spike services
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/proftest-spike.pid" ]; then kill "$(cat "$RUNNER_TEMP/proftest-spike.pid")" || true; fi
      - name: Stop Andromeda API
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/andromeda-proftest.pid" ]; then kill "$(cat "$RUNNER_TEMP/andromeda-proftest.pid")" || true; fi
