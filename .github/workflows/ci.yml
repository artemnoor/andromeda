name: contract-first-tracer

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev]"
      - run: python -m pytest -q
        working-directory: backend
      - run: python backend/scripts/run_tracer_bullet.py --mode fixture --database-url sqlite:///backend/data/ci.db --log-level ERROR
      - run: python -m mypy
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev]"
      - run: python backend/scripts/export_openapi.py --out frontend/openapi.ci.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check-api-drift
        working-directory: frontend
        env:
          OPENAPI_FILE: openapi.ci.json
      - run: npm run build
        working-directory: frontend
