name: source-health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROMEDA_ENV: staging
      ANDROMEDA_DATABASE_URL: ${{ secrets.ANDROMEDA_HEALTH_DATABASE_URL }}
      FRONTEND_ORIGIN: ${{ vars.ANDROMEDA_FRONTEND_ORIGIN || 'https://andromeda.example.org' }}
      ANDROMEDA_OPS_API_KEY: ${{ secrets.ANDROMEDA_OPS_API_KEY }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install backend
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.28
          uv sync --locked --extra dev
        working-directory: backend
      - name: Run live source health
        run: uv run --locked --extra dev python scripts/source_health.py --artifact "$GITHUB_WORKSPACE/source-health.json"
        working-directory: backend
      - name: Upload source health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health
          path: source-health.json
