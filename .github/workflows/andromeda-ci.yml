name: andromeda-ci

on:
  push:
  pull_request:

jobs:
  telegram-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Telegram client
        run: python -m pip install -e "telegram-bot[dev]"
      - name: Run Telegram client tests
        run: python -m pytest -q
        working-directory: telegram-bot
      - name: Run strict Telegram client typing
        run: python -m mypy src
        working-directory: telegram-bot

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler for study-plan parsing
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
          pdftotext -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify BMSTU study-plan text layer
        run: |
          pdftotext -layout backend/tests/fixtures/tracer/raw/curriculum.pdf "$RUNNER_TEMP/bmstu-curriculum.txt"
          grep -q "ПЛАН УЧЕБНОГО ПРОЦЕССА" "$RUNNER_TEMP/bmstu-curriculum.txt"
      - run: python -m pip install -e "backend[dev,browser]"
      - name: Run backend tests
        run: python -m pytest -q
        working-directory: backend
      - name: Run all-university fixture ingestion and canonical API smoke
        run: python backend/scripts/run_andromeda_ingestion.py --university all --mode fixture --database-url sqlite:///backend/data/ci.db --log-level ERROR
      - name: Run strict backend typing
        run: python -m mypy
        working-directory: backend

  frontend-next:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev]"
      - name: Export canonical OpenAPI contract
        run: python backend/scripts/export_openapi.py --out frontend-next/openapi.ci.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
        working-directory: frontend-next
      - name: Check generated API client drift
        run: npm run check-api-drift
        working-directory: frontend-next
        env:
          OPENAPI_FILE: openapi.ci.json
      - name: Run Next unit tests
        run: npm run test:unit
        working-directory: frontend-next
      - name: Lint canonical Next app
        run: npm run lint
        working-directory: frontend-next
      - name: Build canonical Next app
        run: npm run build
        working-directory: frontend-next

  fullstack:
    runs-on: ubuntu-latest
    needs: [backend, frontend-next]
    env:
      ANDROMEDA_OPS_API_KEY: ci-admin-ops-key
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler for study-plan parsing
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
        working-directory: frontend-next
      - name: Run fixture through DB, API, and canonical Next app
        run: python backend/scripts/run_andromeda_demo.py --mode fixture --check --log-level INFO
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend-next
      - name: Start fixture demo for browser tests
        shell: bash
        run: |
          python backend/scripts/run_andromeda_demo.py --mode fixture --log-level INFO > "$RUNNER_TEMP/andromeda-demo.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/andromeda-demo.pid"
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/andromeda-demo.log"
          exit 1
      - name: Run canonical browser scenarios
        run: npm run test:e2e
        working-directory: frontend-next
      - name: Stop fixture demo
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/andromeda-demo.pid" ]; then kill "$(cat "$RUNNER_TEMP/andromeda-demo.pid")" || true; fi

  postgresql-integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend-next]
    env:
      ANDROMEDA_ENV: test
      ANDROMEDA_POSTGRES_TEST_URL: postgresql+psycopg://andromeda:andromeda-ci@127.0.0.1:5432/andromeda_ci
      ANDROMEDA_DATABASE_URL: postgresql+psycopg://andromeda:andromeda-ci@127.0.0.1:5432/andromeda_ci
      LOG_LEVEL: INFO
      ANDROMEDA_OPS_API_KEY: ci-admin-ops-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: andromeda_ci
          POSTGRES_USER: andromeda
          POSTGRES_PASSWORD: andromeda-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andromeda -d andromeda_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler for study-plan parsing
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev]"
      - name: Apply Alembic migrations to PostgreSQL
        run: python -m alembic upgrade head
        working-directory: backend
      - name: Run PostgreSQL repository and API checks
        run: python -m pytest -q tests/integration/test_postgresql_ingestion.py tests/integration/test_postgresql_smoke.py tests/integration/test_postgresql_user_profile.py tests/integration/test_personal_route_vertical_slice.py tests/integration/test_admission_fit_vertical_slice.py tests/integration/test_campus_storage_vertical_slice.py tests/integration/test_campus_live_projection_safety.py tests/vertical/test_campus_vertical_slice.py tests/vertical/test_personal_route_scope_guard.py
        working-directory: backend
      - name: Run auth/profile persistence checks
        run: python -m pytest -q tests/api/test_auth_api.py tests/integration/test_user_profile_persistence.py
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
        working-directory: frontend-next
      - name: Export PostgreSQL job OpenAPI contract
        run: python backend/scripts/export_openapi.py --out frontend-next/openapi.ci.json
      - run: npm run check-api-drift
        working-directory: frontend-next
        env:
          OPENAPI_FILE: openapi.ci.json
      - name: Run canonical Next build
        run: npm run build
        working-directory: frontend-next
      - name: Run PostgreSQL fixture fullstack check
        run: python backend/scripts/run_andromeda_demo.py --mode fixture --database-url "$ANDROMEDA_DATABASE_URL" --check --log-level INFO
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend-next
      - name: Start PostgreSQL-backed demo for browser tests
        shell: bash
        run: |
          python backend/scripts/run_andromeda_demo.py --mode fixture --database-url "$ANDROMEDA_DATABASE_URL" --log-level INFO > "$RUNNER_TEMP/andromeda-postgres-demo.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/andromeda-postgres-demo.pid"
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/andromeda-postgres-demo.log"
          exit 1
      - name: Run PostgreSQL-backed browser scenarios
        run: npm run test:e2e
        working-directory: frontend-next
      - name: Stop PostgreSQL-backed demo
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/andromeda-postgres-demo.pid" ]; then kill "$(cat "$RUNNER_TEMP/andromeda-postgres-demo.pid")" || true; fi

  proftest-integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend-next]
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler for fixture contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[dev,browser]"
      - name: Run production proftest and admission-fit checks
        run: python -m pytest -q backend/tests/modules/proftest backend/tests/modules/admission_fit backend/tests/api/test_proftest_api.py backend/tests/api/test_proftest_contract.py backend/tests/api/test_proftest_profile_api.py backend/tests/api/test_proftest_profile_contract.py backend/tests/api/test_admission_fit_api.py backend/tests/api/test_admission_fit_contract.py backend/tests/integration/test_proftest_catalog.py backend/tests/integration/test_proftest_vertical_slice.py backend/tests/integration/test_user_profile_persistence.py backend/tests/integration/test_admission_fit_vertical_slice.py
      - name: Run auth module and API checks
        run: python -m pytest -q backend/tests/modules/auth backend/tests/api/test_auth_api.py backend/tests/integration/test_user_profile_persistence.py
      - name: Run recommendation module and API integration tests
        run: python -m pytest -q backend/tests/modules/recommendations backend/tests/api/test_recommendations_api.py backend/tests/api/test_recommendations_contract.py backend/tests/integration/test_recommendations_catalog.py
      - name: Run strict Andromeda typing gate
        run: python -m mypy backend/src/andromeda
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
        working-directory: frontend-next
      - name: Run canonical Next unit tests
        run: npm run test:unit
        working-directory: frontend-next
